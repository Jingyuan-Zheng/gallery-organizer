# Gallery Organizer settings. Paste paths after '='; do not add quotes around paths with spaces.
# Paths beginning with / or ~ are absolute. Other paths are relative to the parent named above them.
# Preview each script before applying changes. The scripts do not run as one automatic pipeline.

[general]
# Terminal and generated category-folder language: en (default) or zh (Chinese).
# Leave blank to use English. Existing folders are not renamed when changed.
language = en

[paths]
# All media sources and classification destinations must be within this root.
backup_root = ~/Pictures/GalleryOrganizer
# Parent of the library and classified media; relative to backup_root.
gallery_root = Gallery
# Main organizer's confirmed camera media; relative to gallery_root.
main_library_root = Main
# Parent of the stage 0 and stage 1 folders; relative to backup_root.
inbox_root = Incoming
# Stage 0 input batches; relative to inbox_root. Specify an immediate child when running.
source_stage0_root = Stage0
# Completed stage 0 batches; relative to inbox_root.
completed_source_root = Stage1
# Camera media confirmed by the second-stage organizer; relative to gallery_root.
second_stage_library_root = SortedFromUnsorted
# Parent of duplicate quarantine folders; relative to gallery_root.
duplicate_root = Duplicate
# Alternate formats of an image confirmed by the main organizer; relative to duplicate_root.
format_variant_duplicate_root = FormatVariants
# Whole duplicate groups found in the second stage; relative to duplicate_root.
second_stage_duplicate_root = Unsorted
# Downloads and media with uncertain origins found in the second stage; relative to gallery_root.
other_media_root = OtherMedia
# Media needing review for date, sidecar, or format issues; relative to gallery_root.
repair_media_root = NeedsRepair
# Confirmed screenshots and screen recordings; relative to gallery_root.
screen_root = Screenshots
# JPEG metadata repair: photos needing manual review and CSV reports; relative to gallery_root.
metadata_review_root = MetadataReview
# JPEG metadata repair: original-file backups; relative to gallery_root.
metadata_backup_root = MetadataRepairBackups
# JPEG metadata repair: temporary working files; relative to gallery_root.
metadata_work_root = MetadataRepairWork
# SHA-256 cache database. Deleting it affects speed only.
hash_cache_db = ~/Library/Caches/GalleryOrganizer/sha256-cache.sqlite3

# Leave blank to search the system. Otherwise, paste the executable's full path.
[tools]
xattr =
ditto =
file =
sips =
exiftool =
heif_convert =
ffmpeg =

# Used only by repair_photo_metadata.py. Set the time zone and both dates to enable writing.
[metadata_repair]
# Confirmed capture UTC offset, for example +08:00, +01:00, or -05:30.
utc_offset =
# First eligible date, inclusive, in YYYYMMDD format.
auto_from =
# Last eligible date, inclusive, in YYYYMMDD format.
auto_through =
# Months excluded from automatic repair: comma-separated YYYYMM values.
review_months =

# Dataset-specific evidence. Leave all three fields blank unless individually verified.
# Name of a verified GPS derivative. Requires the UTC timestamp below.
confirmed_gps_derivative_filename =
# Verified GPS timestamp for the derivative, in YYYYMMDDTHHMMSSZ format.
confirmed_gps_derivative_utc =
# Comma-separated full filenames whose capture times have been individually verified.
validated_filename_sequence =
