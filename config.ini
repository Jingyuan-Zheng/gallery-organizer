# Gallery Organizer 设置。等号右边直接填写路径；有空格也不需要引号。
# 以 / 或 ~ 开头的是完整路径；其他路径从 backup_root 算起。
# 首次使用请先检查所有目标目录，再运行脚本预览。

[paths]
backup_root = ~/Pictures/GalleryOrganizer
gallery_root = Gallery
main_library_root = Gallery/Main
inbox_root = Incoming
source_stage0_root = Incoming/Stage0
completed_source_root = Incoming/Stage1
second_stage_inbox_root = Incoming/Unsorted
second_stage_library_root = Gallery/SortedFromUnsorted
duplicate_root = Gallery/Duplicate
format_variant_duplicate_root = Gallery/Duplicate/FormatVariants
second_stage_duplicate_root = Gallery/Duplicate/Unsorted
other_media_root = Gallery/OtherMedia
repair_media_root = Gallery/NeedsRepair
screen_root = Gallery/Screenshots
metadata_review_root = Gallery/MetadataReview
metadata_backup_root = Gallery/MetadataRepairBackups
metadata_work_root = Gallery/MetadataRepairWork
hash_cache_db = ~/Library/Caches/GalleryOrganizer/sha256-cache.sqlite3

# 留空则从系统查找工具。若找不到，可粘贴完整程序路径。
[tools]
xattr =
ditto =
file =
sips =
exiftool =
heif_convert =
ffmpeg =

# 只用于 repair_photo_metadata.py。默认留空时禁止执行写入。
# 时区示例：+08:00、+01:00、-05:30。
# 日期格式 YYYYMMDD；起始日和结束日均包含在范围内。
# 不确定时区的月份可写成 YYYYMM，用逗号分隔。
[metadata_repair]
utc_offset =
auto_from =
auto_through =
review_months =

# 以下证据只在你亲自核实过照片后填写；默认留空。
confirmed_gps_derivative_filename =
confirmed_gps_derivative_utc =
validated_filename_sequence =
