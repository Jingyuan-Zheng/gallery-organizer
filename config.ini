# Gallery Organizer 设置：等号右边可直接粘贴路径；有空格也不用加引号。
# / 或 ~ 开头表示完整路径；其他值相对于注释写明的上级目录。
# 请先检查目标目录，再运行脚本预览；脚本不会自动处理整个流水线。

[paths]
# 所有媒体来源和分类目标必须位于此目录下；来源目录由运行脚本时指定。
backup_root = ~/Pictures/GalleryOrganizer
# 图库与分类输出的上级目录；相对 backup_root。
gallery_root = Gallery
# 主整理脚本的相机图库；相对 gallery_root。
main_library_root = Main
# 阶段0、阶段1的上级目录；相对 backup_root。
inbox_root = Incoming
# 主整理脚本可处理的阶段0目录；相对 inbox_root。仅其直接子目录可在成功后归档。
source_stage0_root = Stage0
# 上述子目录成功处理后的归档位置；相对 inbox_root。
completed_source_root = Stage1
# 第二阶段重新确认的相机媒体目标；相对 gallery_root。
second_stage_library_root = SortedFromUnsorted
# 各类重复副本的上级目录；相对 gallery_root。
duplicate_root = Duplicate
# 主整理中同图但非首选格式的隔离位置；相对 duplicate_root。
format_variant_duplicate_root = FormatVariants
# 第二阶段整组重复媒体的隔离位置；相对 duplicate_root。
second_stage_duplicate_root = Unsorted
# 第二阶段下载、来源不明等普通媒体分类；相对 gallery_root。
other_media_root = OtherMedia
# 第二阶段时间、关联或格式异常的待修复媒体；相对 gallery_root。
repair_media_root = NeedsRepair
# 第二阶段确认的截图和录屏；相对 gallery_root。
screen_root = Screenshots
# 拍摄时间修复脚本无法自动修复、需要人工核对的照片及报告；相对 gallery_root。
metadata_review_root = MetadataReview
# 拍摄时间修复前的原文件备份；相对 gallery_root。
metadata_backup_root = MetadataRepairBackups
# 拍摄时间修复的临时工作文件；相对 gallery_root，完成后清理空目录。
metadata_work_root = MetadataRepairWork
# SHA-256 缓存数据库文件；可填完整路径。删掉缓存只会影响速度。
hash_cache_db = ~/Library/Caches/GalleryOrganizer/sha256-cache.sqlite3

# 留空则从系统查找工具。若找不到，可粘贴完整程序路径。
[tools]
xattr =
ditto =
file =
sips =
exiftool =
heif_convert =
ffmpeg =

# 只用于 repair_photo_metadata.py；时区和两个日期都填齐后才能执行写入。
[metadata_repair]
# 已亲自确认的拍摄地时区，例如 +08:00、+01:00、-05:30。
utc_offset =
# 自动修复允许的第一天，格式 YYYYMMDD，例如 20200101。
auto_from =
# 自动修复允许的最后一天（包含这一天），格式 YYYYMMDD，例如 20241231。
auto_through =
# 即使在上述范围内也不自动修复的月份；YYYYMM，多个用逗号分隔。
review_months =

# 以下三项是特定照片集合的人工证据；一般用户保持空白。
# 已核实与原图相同的衍生照片文件名；必须同时填写下一项 UTC 时刻。
confirmed_gps_derivative_filename =
# 上述照片的已核实 GPS UTC 时刻，格式 YYYYMMDDTHHMMSSZ。
confirmed_gps_derivative_utc =
# 已逐张核实文件名时间的照片；填写完整文件名，多个用逗号分隔。
validated_filename_sequence =
